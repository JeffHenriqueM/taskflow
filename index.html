<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow & Timer — Gerenciador de Tarefas</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⏱️</text></svg>">
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-layout">
    <!-- Header -->
    <header class="app-header">
      <div class="header-content">
        <div class="logo-area">
          <div class="logo-icon">⏱️</div>
          <div>
            <h1>TaskFlow & Timer</h1>
            <p class="subtitle">Gestão de tarefas com cronômetro integrado e subtarefas</p>
          </div>
        </div>
        <div class="header-actions">
          <button id="btnResetDefaults" class="btn btn-secondary" title="Restaurar a lista original de 12 tarefas">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
            Restaurar Lista Padrão
          </button>
          <button id="btnExport" class="btn btn-secondary" title="Exportar backup dos dados">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Exportar
          </button>
          <label class="btn btn-secondary" title="Importar backup dos dados">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            Importar
            <input type="file" id="importInput" accept=".json" style="display: none;">
          </label>
        </div>
      </div>
    </header>

    <!-- Metrics Bar -->
    <section class="metrics-grid">
      <div class="metric-card">
        <div class="metric-icon blue">📋</div>
        <div class="metric-info">
          <span class="metric-label">Total de Tarefas</span>
          <span class="metric-value" id="statTotalTasks">0</span>
        </div>
      </div>
      <div class="metric-card">
        <div class="metric-icon orange">⏳</div>
        <div class="metric-info">
          <span class="metric-label">Pendentes</span>
          <span class="metric-value" id="statPendingTasks">0</span>
        </div>
      </div>
      <div class="metric-card">
        <div class="metric-icon green">✅</div>
        <div class="metric-info">
          <span class="metric-label">Concluídas</span>
          <span class="metric-value" id="statCompletedTasks">0</span>
        </div>
      </div>
      <div class="metric-card">
        <div class="metric-icon purple">⏱️</div>
        <div class="metric-info">
          <span class="metric-label">Tempo Total Registrado</span>
          <span class="metric-value" id="statTotalTime">00h 00m</span>
        </div>
      </div>
    </section>

    <!-- Active Timer Banner (if running) -->
    <div id="activeTimerBanner" class="active-timer-banner hidden">
      <div class="active-timer-content">
        <div class="pulse-indicator"></div>
        <div>
          <span class="active-timer-label">Cronômetro ativo:</span>
          <strong id="activeTaskTitle">Nome da Tarefa</strong>
        </div>
      </div>
      <div class="active-timer-display" id="activeTaskTime">00:00:00</div>
      <button id="btnPauseActiveTimer" class="btn btn-warning btn-sm">Pausar</button>
    </div>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Form to add task -->
      <section class="task-form-card">
        <h2>Adicionar Nova Tarefa</h2>
        <form id="taskForm" class="task-form">
          <div class="form-row">
            <div class="form-group flex-1">
              <label for="taskTitle">Título da Tarefa *</label>
              <input type="text" id="taskTitle" placeholder="Ex: Produzir criativos para campanha" required>
            </div>
            <div class="form-group">
              <label for="taskCategory">Categoria</label>
              <input type="text" id="taskCategory" placeholder="Ex: FIAS, TikTok, Pessoal">
            </div>
            <div class="form-group">
              <label for="taskPriority">Prioridade</label>
              <select id="taskPriority">
                <option value="baixa">Baixa</option>
                <option value="media" selected>Média</option>
                <option value="alta">Alta</option>
                <option value="urgente">Urgente</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="taskDescription">Descrição / Notas (Opcional)</label>
            <textarea id="taskDescription" rows="2" placeholder="Observações, escopo ou links..."></textarea>
          </div>

          <!-- Initial Subtasks Input -->
          <div class="form-group">
            <label>Subtarefas Iniciais (Opcional)</label>
            <div class="subtask-input-wrapper">
              <input type="text" id="initialSubtaskInput" placeholder="Digite uma subtarefa e tecle 'Adicionar' ou Enter">
              <button type="button" id="btnAddInitialSubtask" class="btn btn-secondary">Adicionar</button>
            </div>
            <div id="initialSubtasksList" class="initial-subtasks-chips"></div>
          </div>

          <div class="form-footer">
            <button type="submit" class="btn btn-primary">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              Salvar Tarefa
            </button>
          </div>
        </form>
      </section>

      <!-- Task Controls & Filters -->
      <section class="tasks-toolbar">
        <div class="search-box">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="searchInput" placeholder="Pesquisar tarefas ou subtarefas...">
        </div>
        <div class="filter-buttons">
          <button class="filter-btn active" data-filter="all">Todas</button>
          <button class="filter-btn" data-filter="pending">Pendentes</button>
          <button class="filter-btn" data-filter="completed">Concluídas</button>
        </div>
      </section>

      <!-- Tasks List -->
      <section id="tasksContainer" class="tasks-container">
        <!-- Rendered via JavaScript -->
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
